name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify application
        run: ./mvnw --batch-mode verify

      - name: Build JVM fallback container
        run: docker build --file Dockerfile.jvm --tag consumer:jvm .

      - name: Verify JVM container delivery contract
        run: .github/scripts/verify-container.sh consumer:jvm

  native:
    # The published image is the GraalVM native executable (Dockerfile). Building it proves the AOT
    # processing and native-image metadata are complete; the smoke test proves the OpenWire client,
    # Jackson type-id conversion and SMTP delivery work in the binary, not only on the JVM.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Build native container
        run: docker build --tag consumer:native .

      - name: Smoke test native container (Artemis -> consumer -> Mailpit)
        run: scripts/native-smoke.sh consumer:native
