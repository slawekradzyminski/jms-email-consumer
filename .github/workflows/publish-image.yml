name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease image version matching the Maven snapshot line (for example, 3.3.4-rc.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate source and image version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual="$(./mvnw --batch-mode -Dstyle.color=never help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Publishing commit $GITHUB_SHA is not contained in origin/master" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            if [[ "$actual" == *-SNAPSHOT || "$actual" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME requires exact non-snapshot Maven version $version; found $actual" >&2
              exit 1
            fi
          else
            version="$REQUESTED_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
              echo "Manual version must be a semantic prerelease such as 3.3.4-rc.1: $version" >&2
              exit 1
            fi
            release_line="${version%%-*}"
            if [[ "$actual" != "${release_line}-SNAPSHOT" ]]; then
              echo "Candidate $version requires Maven version ${release_line}-SNAPSHOT; found $actual" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify application
        run: ./mvnw --batch-mode verify

      - name: Build verification container
        run: docker build --tag consumer:verification .

      - name: Verify container delivery contract
        run: .github/scripts/verify-container.sh consumer:verification

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            slawekradzyminski/consumer
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=sha,prefix=sha-
          flavor: |
            latest=false

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Report manifest digest
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Published consumer image

          - Version: `${{ needs.verify.outputs.version }}`
          - Digest: `${{ steps.build.outputs.digest }}`
          - Platforms: `linux/amd64`, `linux/arm64`
          - Registries: `ghcr.io/${{ github.repository }}`, `slawekradzyminski/consumer`
          - Tags: version and commit SHA
          - Supply chain: SBOM and provenance enabled
          EOF
